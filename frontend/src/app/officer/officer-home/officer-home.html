<h2>Pending Applications</h2>

<div *ngIf="loading">
  Loading...
</div>

<div *ngIf="errorMessage" style="color:red">
  {{ errorMessage }}
</div>

<div *ngIf="successMessage" style="color:green">
  {{ successMessage }}
</div>

<div *ngIf="!loading && applications.length === 0">
  No pending applications.
</div>

<table
  *ngIf="!loading && applications.length > 0"
  border="1"
  cellpadding="8">

  <thead>
    <tr>
      <th>Reference</th>
      <th>Applicant</th>
      <th>Amount</th>
      <th>Term</th>
      <th>Purpose</th>
      <th>Status</th>
      <th>Review</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let app of applications">

      <td>{{ app.reference }}</td>

      <td>{{ app.applicantName }}</td>

      <td>{{ app.loanAmount | currency }}</td>

      <td>{{ app.termMonths }}</td>

      <td>{{ app.purpose }}</td>

      <td>{{ app.status }}</td>

      <td>
        <button
          [routerLink]="['/officer/applications', app.id]">
          Review
        </button>
      </td>

    </tr>
  </tbody>

</table>
